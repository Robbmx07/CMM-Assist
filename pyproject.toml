[project]
name = "cmm-gen"
version = "0.1.0"
description = "Generates production-ready PC-DMIS inspection routines from a STEP model and a blueprint."
requires-python = ">=3.11"
readme = "README.md"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
namespace_packages = true
exclude = ["tests/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
