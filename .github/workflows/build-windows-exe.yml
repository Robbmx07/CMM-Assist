name: Build Windows CLI executable

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "cmm_gen/**"
      - "config/**"
      - "requirements.txt"
      - "packaging/cmm-gen.spec"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        run: pyinstaller packaging/cmm-gen.spec --distpath dist --workpath build --noconfirm

      - name: Smoke test the built executable
        run: |
          .\dist\cmm-gen.exe parse-cad --step tests\fixtures\sample_part.step
          .\dist\cmm-gen.exe parse-cad --step tests\fixtures\two_slots_part.step
          Write-Host "Both smoke tests passed."

      - uses: actions/upload-artifact@v4
        with:
          name: cmm-gen-windows-exe
          path: dist/cmm-gen.exe
          if-no-files-found: error

      # Actions-artifact downloads redirect through Azure Blob Storage, which
      # isn't reachable from every environment that wants this file (e.g. a
      # policy-restricted sandbox). A release asset is a stable, direct
      # github.com download link instead -- one canonical "latest" release
      # whose asset this step replaces on every build, rather than piling up
      # a new release per run.
      - name: Publish to the "windows-exe-latest" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view windows-exe-latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-exe-latest `
              --repo $env:GITHUB_REPOSITORY `
              --title "CMM-Gen Windows CLI (latest)" `
              --notes "Standalone Windows executable (cmm-gen.exe), auto-built and smoke-tested from the latest commit on branch $env:GITHUB_REF_NAME. See TESTING_CHECKLIST.md for how to use it. This asset is replaced on every build -- it is not a versioned release."
          }
          gh release upload windows-exe-latest dist/cmm-gen.exe --repo $env:GITHUB_REPOSITORY --clobber
